<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meerforellen-Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=Source+Sans+3:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<style>
  :root {
    --bg: #E9F1EF; --surface: #FFFFFF; --surface-2: #F2F7F6;
    --ink: #10262A; --ink-soft: #4C6B6E; --ink-faint: #7E9A9C; --border: #C7DCD9;
    --accent: #0E6E7A; --accent-strong: #084A52; --accent-wash: #DCEEEE;
    --catch: #B9781A; --catch-wash: #F7EAD3;
    --parking: #5D6E80; --parking-wash: #E7ECF1;
    --access: #7A5D9E; --access-wash: #EEE7F5;
    --danger: #B0392E;
    --shadow: 0 8px 24px -12px rgba(8, 40, 44, 0.28);
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0A1A1D; --surface: #102428; --surface-2: #0D1F22;
      --ink: #E6F2F1; --ink-soft: #9FBCBC; --ink-faint: #6D8D8E; --border: #1E3C40;
      --accent: #4FC6D1; --accent-strong: #8CE0E8; --accent-wash: #123338;
      --catch: #E3A63D; --catch-wash: #33270F;
      --parking: #9FB1C2; --parking-wash: #1B2530;
      --access: #C6ACE8; --access-wash: #251C33;
      --danger: #E2685C;
      --shadow: 0 8px 28px -12px rgba(0, 0, 0, 0.55);
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: "Source Sans 3", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  h1, h2, .display { font-family: "Big Shoulders Display", system-ui, sans-serif; text-transform: uppercase; letter-spacing: 0.02em; font-weight: 700; }
  .mono { font-family: "JetBrains Mono", ui-monospace, monospace; font-variant-numeric: tabular-nums; }
  a { color: inherit; }
  button { font-family: inherit; }

  #app { display: flex; flex-direction: column; height: 100%; }

  header.topbar {
    flex: 0 0 auto; z-index: 20;
    background: var(--accent-strong); color: #F3FBFA;
    padding: 10px 16px; box-shadow: var(--shadow);
    display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  }
  .topbar-title { display: flex; align-items: baseline; gap: 10px; }
  .topbar-title h1 { font-size: 1.3rem; margin: 0; color: #F3FBFA; }
  .topbar-sub { font-size: 0.68rem; color: #AEE0E2; letter-spacing: 0.06em; text-transform: uppercase; }
  .profile-avatar { width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,0.45); background: rgba(255,255,255,0.14); color: #fff; font-size: 0.7rem; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; font-family: "Source Sans 3", sans-serif; padding: 0; flex: 0 0 auto; }
  .field input:disabled { opacity: 0.6; }
  .stats { display: flex; gap: 8px; overflow-x: auto; }
  .stat-chip { flex: 0 0 auto; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.16); border-radius: 10px; padding: 4px 10px; }
  .stat-chip .val { font-family: "JetBrains Mono", monospace; font-weight: 700; font-size: 0.95rem; color: #F3FBFA; display: block; }
  .stat-chip .lbl { font-size: 0.6rem; color: #AEE0E2; text-transform: uppercase; letter-spacing: 0.05em; }

  nav.tabs { flex: 0 0 auto; display: flex; gap: 6px; background: var(--surface); padding: 8px 16px; border-bottom: 1px solid var(--border); }
  .tab-btn { border: 1px solid var(--border); background: var(--surface-2); color: var(--ink-soft); padding: 6px 14px; border-radius: 999px; font-size: 0.85rem; font-weight: 600; cursor: pointer; }
  .tab-btn[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }

  main { flex: 1; min-height: 0; position: relative; }
  #mapPane { position: absolute; inset: 0; }
  #map { width: 100%; height: 100%; background: var(--surface-2); }
  #listPane { position: absolute; inset: 0; overflow-y: auto; padding: 12px 16px 90px; background: var(--bg); }
  [hidden] { display: none !important; }

  .map-hint {
    position: absolute; top: 54px; left: 50%; transform: translateX(-50%);
    background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow);
    padding: 6px 14px; border-radius: 999px; font-size: 0.8rem; color: var(--ink-soft);
    z-index: 500; pointer-events: none;
    max-width: calc(100% - 120px); text-align: center;
  }
  .map-filter-row {
    position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
    z-index: 500; display: flex; gap: 6px; flex-wrap: wrap; justify-content: center;
    max-width: calc(100% - 120px);
  }
  .map-filter-chip {
    background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow);
    padding: 5px 12px; border-radius: 999px; font-size: 0.76rem; font-weight: 600;
    color: var(--ink-faint); cursor: pointer; white-space: nowrap;
  }
  .map-filter-chip.active { color: #fff; border-color: transparent; }
  .map-filter-chip.active[data-type="spot"] { background: var(--accent); }
  .map-filter-chip.active[data-type="catch"] { background: var(--catch); color: #241800; }
  .map-filter-chip.active[data-type="parking"] { background: var(--parking); }
  .map-filter-chip.active[data-type="access"] { background: var(--access); }

  .filter-row { display: flex; gap: 8px; margin-bottom: 12px; }
  .filter-row input[type="search"] { flex: 1; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 8px 10px; color: var(--ink); font-size: 0.9rem; }

  .card-list { display: flex; flex-direction: column; gap: 8px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px; }
  .card-top { display: flex; align-items: flex-start; gap: 10px; }
  .badge { flex: 0 0 auto; width: 32px; height: 32px; border-radius: 9px; display: flex; align-items: center; justify-content: center; font-size: 1rem; }
  .badge.spot { background: var(--accent-wash); color: var(--accent); }
  .badge.catch { background: var(--catch-wash); color: var(--catch); }
  .badge.catch.unlanded { background: transparent; border: 1.5px dashed var(--catch); }
  .badge.parking { background: var(--parking-wash); color: var(--parking); }
  .badge.access { background: var(--access-wash); color: var(--access); }
  .card-body { flex: 1; min-width: 0; }
  .card-title-row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .card-title { font-weight: 700; }
  .card-meta { font-size: 0.76rem; color: var(--ink-soft); }
  .card-stat { font-family: "JetBrains Mono", monospace; font-weight: 700; color: var(--catch); }
  .card-notes { font-size: 0.85rem; color: var(--ink-soft); margin-top: 6px; line-height: 1.4; }
  .card-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .tag { font-size: 0.72rem; background: var(--surface-2); border: 1px solid var(--border); color: var(--ink-soft); padding: 2px 8px; border-radius: 999px; }
  .card-actions { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .card-actions a, .card-actions button { font-size: 0.78rem; text-decoration: none; border: 1px solid var(--border); background: var(--surface-2); color: var(--ink); padding: 6px 10px; border-radius: 8px; cursor: pointer; }
  .card-actions .danger { color: var(--danger); border-color: var(--danger); background: transparent; }
  .empty-state { text-align: center; padding: 40px 16px; color: var(--ink-faint); }

  .fab { position: fixed; right: 18px; bottom: 22px; z-index: 900; background: var(--catch); color: #241800; border: none; width: 56px; height: 56px; border-radius: 50%; font-size: 1.6rem; box-shadow: var(--shadow); cursor: pointer; }

  .pin-icon { width: 30px; height: 30px; position: relative; }
  .pin-icon .dot { position: absolute; left: 50%; top: 50%; width: 22px; height: 22px; margin: -22px 0 0 -11px; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); border: 2px solid #fff; box-shadow: 0 1px 5px rgba(0,0,0,0.5); }
  .pin-icon.spot .dot { background: var(--accent); }
  .pin-icon.parking .dot { background: var(--parking); }
  .pin-icon.access .dot { background: var(--access); }
  .pin-icon.fish { width: 38px; height: 22px; display: flex; align-items: center; justify-content: center; }
  .pin-icon.fish img { width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 1px 3px rgba(0,0,0,0.5)); }
  .pin-icon.fish.unlanded img { opacity: 0.5; filter: grayscale(0.8) drop-shadow(0 1px 2px rgba(0,0,0,0.4)); }
  .badge-fish-img { width: 22px; height: 22px; object-fit: contain; }
  .badge.catch.unlanded .badge-fish-img { opacity: 0.55; filter: grayscale(0.8); }
  .leaflet-popup-content-wrapper { border-radius: var(--radius); background: var(--surface); color: var(--ink); }
  .leaflet-popup-content { margin: 10px 12px; min-width: 220px; }
  .leaflet-popup-tip { background: var(--surface); }

  .sheet-backdrop { position: fixed; inset: 0; background: rgba(6,20,22,0.5); z-index: 1000; display: flex; align-items: flex-end; justify-content: center; }
  .sheet { width: 100%; max-width: 520px; max-height: min(88vh, 720px); overflow-y: auto; background: var(--surface); border-radius: 18px 18px 0 0; padding: 18px 18px calc(18px + env(safe-area-inset-bottom, 0px)); box-shadow: var(--shadow); }
  .sheet h2 { margin: 0 0 12px; font-size: 1.2rem; }
  .type-picker { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; }
  .type-opt { border: 1px solid var(--border); background: var(--surface-2); color: var(--ink-soft); padding: 7px 12px; border-radius: 999px; font-size: 0.82rem; font-weight: 600; cursor: pointer; }
  .type-opt[aria-pressed="true"].spot { background: var(--accent); border-color: var(--accent); color: #fff; }
  .type-opt[aria-pressed="true"].catch { background: var(--catch); border-color: var(--catch); color: #241800; }
  .type-opt[aria-pressed="true"].parking { background: var(--parking); border-color: var(--parking); color: #fff; }
  .type-opt[aria-pressed="true"].access { background: var(--access); border-color: var(--access); color: #fff; }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 0.76rem; font-weight: 600; color: var(--ink-soft); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.04em; }
  .field input, .field select, .field textarea { width: 100%; background: var(--surface-2); border: 1px solid var(--border); border-radius: 9px; padding: 9px 10px; color: var(--ink); font-size: 0.95rem; font-family: inherit; }
  .field textarea { min-height: 60px; resize: vertical; }
  .field-row { display: flex; gap: 10px; }
  .field-row .field { flex: 1; min-width: 0; }
  .form-hint { font-size: 0.74rem; color: var(--ink-faint); margin: -6px 0 12px; }
  .sheet-actions { display: flex; gap: 10px; margin-top: 16px; }
  .btn-primary, .btn-secondary { flex: 1; padding: 11px; border-radius: 10px; font-weight: 700; font-size: 0.95rem; border: none; cursor: pointer; }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-secondary { background: var(--surface-2); color: var(--ink-soft); border: 1px solid var(--border); }
  .toast { position: fixed; top: 14px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 16px; border-radius: 999px; font-size: 0.85rem; z-index: 1100; box-shadow: var(--shadow); }

  .auth-screen { position: fixed; inset: 0; z-index: 2000; background: var(--accent-strong); display: flex; align-items: center; justify-content: center; padding: 24px; }
  .auth-box { width: 100%; max-width: 380px; background: var(--surface); border-radius: 18px; padding: 28px 24px; box-shadow: var(--shadow); }
  .auth-box h1 { font-size: 1.5rem; margin: 0 0 4px; color: var(--ink); }
  .auth-sub { font-size: 0.85rem; color: var(--ink-soft); margin-bottom: 20px; }
  .auth-error { font-size: 0.82rem; color: var(--danger); background: var(--access-wash); border: 1px solid var(--danger); border-radius: 8px; padding: 8px 10px; margin-bottom: 14px; display: none; }
  .auth-error.show { display: block; }
  .auth-mode-switch { text-align: center; font-size: 0.85rem; color: var(--ink-soft); margin-top: 14px; }
  .auth-mode-switch button { background: none; border: none; color: var(--accent); font-weight: 700; cursor: pointer; padding: 0; font-size: inherit; }
  .auth-loading { position: fixed; inset: 0; z-index: 2000; background: var(--accent-strong); display: flex; align-items: center; justify-content: center; color: #fff; font-family: "Big Shoulders Display", sans-serif; text-transform: uppercase; letter-spacing: 0.06em; }
</style>
</head>
<body>
<div class="auth-loading" id="authLoading">L&auml;dt &hellip;</div>

<div class="auth-screen" id="authScreen" hidden>
  <div class="auth-box">
    <h1>Meerforellen&#8209;Log</h1>
    <div class="auth-sub" id="authSub">Mit E-Mail anmelden</div>
    <div class="auth-error" id="authError"></div>
    <div class="field" id="authNameField" hidden><label for="auth_name">Name</label><input id="auth_name" type="text" autocomplete="name" placeholder="Wie sollen wir dich nennen?" /></div>
    <div class="field"><label for="auth_email">E-Mail</label><input id="auth_email" type="email" autocomplete="email" /></div>
    <div class="field"><label for="auth_pass">Passwort</label><input id="auth_pass" type="password" autocomplete="current-password" /></div>
    <div class="sheet-actions">
      <button type="button" class="btn-primary" id="authSubmitBtn" style="flex:1">Anmelden</button>
    </div>
    <div class="auth-mode-switch" id="authModeSwitch">
      Noch kein Konto? <button type="button" id="authModeToggle">Registrieren</button>
    </div>
  </div>
</div>

<div id="app" hidden>
  <header class="topbar">
    <div class="topbar-title">
      <h1>Meerforellen&#8209;Log</h1>
      <span class="topbar-sub" id="viewerNote">&hellip;</span>
      <button type="button" id="profileBtn" class="profile-avatar" aria-label="Profil">?</button>
    </div>
    <div class="stats" id="statsRow"></div>
  </header>

  <nav class="tabs" role="tablist">
    <button class="tab-btn" data-tab="map" role="tab" aria-selected="true">Karte</button>
    <button class="tab-btn" data-tab="catch" role="tab" aria-selected="false">F&auml;nge</button>
    <button class="tab-btn" data-tab="spot" role="tab" aria-selected="false">Spots</button>
    <button class="tab-btn" data-tab="parking" role="tab" aria-selected="false">Parken &amp; Zugang</button>
  </nav>

  <main>
    <div id="mapPane">
      <div id="map"></div>
      <div class="map-filter-row" id="mapFilterRow">
        <button type="button" class="map-filter-chip active" data-type="spot">Spots</button>
        <button type="button" class="map-filter-chip active" data-type="catch">F&auml;nge</button>
        <button type="button" class="map-filter-chip active" data-type="parking">Parken</button>
        <button type="button" class="map-filter-chip active" data-type="access">Zugang</button>
      </div>
      <div class="map-hint">Tippen zum Anlegen &middot; Ziehen zum Bewegen &middot; Pinch/Scroll zum Zoomen</div>
    </div>
    <div id="listPane" hidden>
      <div class="filter-row">
        <input type="search" id="searchInput" placeholder="Suche nach Name, Notiz, K&ouml;der &hellip;" />
      </div>
      <div id="listRoot"></div>
    </div>
  </main>

  <button class="fab" id="fabAdd" aria-label="Neuer Eintrag">+</button>
</div>

    }).join("");
  }

    if (e.method) tags.push(e.method);
    if (e.waterTempC != null) tags.push(e.waterTempC + "° Wasser");
    if (e.wind) tags.push("Wind " + e.wind);
    if (e.salinityPct) tags.push(e.salinityPct + "% Salz");
    if (e.weather) tags.push(e.weather);
    return tags;

          '<div class="badge ' + e.type + (e.type === "catch" && e.landed === false ? " unlanded" : "") + '">' + (e.type === "catch" ? '<img class="badge-fish-img" src="' + FISH_ICON_SRC + '" alt="" />' : TYPE_ICON[e.type]) + "</div>" +
          '<div class="card-body">' +
            '<div class="card-title-row"><div class="card-title">' + escapeHtml(e.name) + "</div>" +
              (statLine ? '<div class="card-stat mono">' + escapeHtml(statLine) + "</div>" : "") + "</div>" +
            '<div class="card-meta mono">' + escapeHtml(metaBits.join(" · ")) + "</div>" +
            (e.notes ? '<div class="card-notes">' + escapeHtml(e.notes) + "</div>" : "") +
            (tags.length ? '<div class="card-tags">' + tags.map(function (t) { return '<span class="tag">' + escapeHtml(t) + "</span>"; }).join("") + "</div>" : "") +
            '<div class="card-actions">' +
              '<a href="' + links.apple + '" target="_blank" rel="noopener">Apple Maps</a>' +
              '<a href="' + links.google + '" target="_blank" rel="noopener">Google Maps</a>' +
              '<button type="button" class="locate-on-map">Auf Karte</button>' +
              '<button type="button" class="edit-btn">Bearbeiten</button>' +
              '<button type="button" class="danger delete-btn">Löschen</button>' +
            "</div>" +
          "</div>" +
        "</div>" +
      "</div>";
  }

  function renderList() {
    var filtered = state.entries.filter(function (e) {
      if (state.tab === "parking") { if (e.type !== "parking" && e.type !== "access") return false; }
      else if (e.type !== state.tab) return false;
      if (state.search) {
        var hay = [e.name, e.notes, e.method, e.wind, e.weather].join(" ").toLowerCase();
        if (hay.indexOf(state.search.toLowerCase()) === -1) return false;
      }
      return true;
    });
    filtered.sort(function (a, b) {
      var da = a.date || a.createdAt || "", db_ = b.date || b.createdAt || "";
      return da < db_ ? 1 : da > db_ ? -1 : 0;
    });
    listRoot.innerHTML = filtered.length
      ? '<div class="card-list">' + filtered.map(cardHtml).join("") + "</div>"
      : '<div class="empty-state">Noch nichts hier. Tippe auf + um einen Eintrag hinzuzufügen.</div>';
  }

  // ---- Leaflet map ----
  var map = L.map("map", { zoomControl: true, attributionControl: true });

  var streetLayer = L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19,
    attribution: "&copy; <a href=\"https://www.openstreetmap.org/copyright\" target=\"_blank\" rel=\"noopener\">OpenStreetMap</a> contributors"
  });

  var satelliteLayer = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", {
    maxZoom: 19,
    attribution: "Tiles &copy; Esri &mdash; Esri, Maxar, Earthstar Geographics, GIS User Community"
  }).addTo(map);

  L.control.layers({
    "Straßenkarte": streetLayer,
    "Satellit": satelliteLayer
  }, null, { position: "topright", collapsed: true }).addTo(map);

  var markers = {};
  var markerLayer = L.layerGroup().addTo(map);
  var ghostMarker = null;
  var mapTypeFilter = { spot: true, catch: true, parking: true, access: true };

  var FISH_ICON_SRC = "icons/fisch-icon-transparent.png";
  var FISH_IMG_TAG = '<img src="' + FISH_ICON_SRC + '" alt="" />';

  function makeIcon(e) {
    if (e.type === "catch") {
      var landed = e.landed !== false;
      return L.divIcon({
        className: "",
        html: '<div class="pin-icon fish' + (landed ? "" : " unlanded") + '">' + FISH_IMG_TAG + "</div>",
        iconSize: [38, 22],
        iconAnchor: [19, 11],
        popupAnchor: [0, -10]
      });
    }
    return L.divIcon({
      className: "",
      html: '<div class="pin-icon ' + e.type + '"><div class="dot"></div></div>',
      iconSize: [30, 30],
      iconAnchor: [15, 28],
      popupAnchor: [0, -26]
    });
  }

  function popupHtml(e) {
    return cardHtml(e);
  }

  function rebuildMarkers() {
    markerLayer.clearLayers();
    markers = {};
    state.entries.forEach(function (e) {
      if (!mapTypeFilter[e.type]) return;
      var m = L.marker([e.lat, e.lng], { icon: makeIcon(e) }).addTo(markerLayer);
      m.bindPopup(popupHtml(e), { closeButton: true, maxWidth: 280 });
      markers[e.id] = m;
    });
  }

  document.querySelectorAll(".map-filter-chip").forEach(function (chip) {
    chip.addEventListener("click", function () {
      var type = chip.getAttribute("data-type");
      mapTypeFilter[type] = !mapTypeFilter[type];
      chip.classList.toggle("active", mapTypeFilter[type]);
      rebuildMarkers();
    });
  });

  function fitToAllEntries() {
    if (!state.entries.length) { map.setView([56, 11], 5); return; }
    var bounds = L.latLngBounds(state.entries.map(function (e) { return [e.lat, e.lng]; }));
    map.fitBounds(bounds, { padding: [40, 40], maxZoom: 13 });
  }

  function seedIfEmpty() {
    if (seedingInProgress) return;
    seedingInProgress = true;
    db.collection("entries").limit(1).get().then(function (snap) {
      if (!snap.empty) return;
      var seed = JSON.parse(document.getElementById("seed-data").textContent);
      var batch = db.batch();
      seed.forEach(function (e) {
        var data = Object.assign({}, e);
        delete data.id;
        batch.set(db.collection("entries").doc(e.id), data);
      });
      return batch.commit();
    }).catch(function (err) {
      console.error("Seed fehlgeschlagen", err);
    }).finally(function () {
      seedingInProgress = false;
    });
  }

  function subscribeEntries() {
    firstSnapshotHandled = false;
    if (unsubscribeEntries) unsubscribeEntries();
    unsubscribeEntries = db.collection("entries").onSnapshot(function (snap) {
      var docs = [];
      snap.forEach(function (doc) {
        var d = doc.data();
        d.id = doc.id;
        docs.push(d);
      });
      state.entries = docs;
      if (!docs.length) seedIfEmpty();
      rebuildMarkers();
      if (!firstSnapshotHandled) { fitToAllEntries(); firstSnapshotHandled = true; }
      renderStats();
      renderList();
    }, function (err) {
      console.error("Firestore-Fehler", err);
      showAuthError(err.code === "permission-denied"
        ? "Diese E-Mail hat noch keinen Zugriff. Bitte Andy um Freischaltung bitten."
        : "Verbindung zur Datenbank verloren.");
      auth.signOut();
    });
  }

  function unsubscribeAndReset() {
    if (unsubscribeEntries) { unsubscribeEntries(); unsubscribeEntries = null; }
    state.entries = [];
    firstSnapshotHandled = false;
  }

  map.on("click", function (ev) {
    if (ghostMarker) { map.removeLayer(ghostMarker); ghostMarker = null; }
    ghostMarker = L.circleMarker(ev.latlng, {
      radius: 10, color: "#B9781A", weight: 2, dashArray: "3 3", fillOpacity: 0
    }).addTo(map);
    openSheet(null, { lat: ev.latlng.lat, lng: ev.latlng.lng, type: "spot" });
  });

  // event delegation for popup + list actions (both use .card markup)
  document.addEventListener("click", function (ev) {
    var card = ev.target.closest(".card");
    if (!card) return;
    var id = card.getAttribute("data-id");
    var entry = state.entries.find(function (e) { return e.id === id; });
    if (!entry) return;
    if (ev.target.closest(".edit-btn")) openSheet(entry);
    if (ev.target.closest(".delete-btn")) {
      if (confirm('"' + entry.name + '" wirklich löschen?')) deleteEntry(entry);
    }
    if (ev.target.closest(".locate-on-map")) {
      document.querySelectorAll(".tab-btn").forEach(function (b) { b.setAttribute("aria-selected", b.getAttribute("data-tab") === "map" ? "true" : "false"); });
      state.tab = "map";
      document.getElementById("mapPane").hidden = false;
      document.getElementById("listPane").hidden = true;
      map.setView([entry.lat, entry.lng], 15);
      setTimeout(function () { if (markers[entry.id]) markers[entry.id].openPopup(); }, 300);
    }
  });

  document.querySelectorAll(".tab-btn").forEach(function (btn) {
    btn.addEventListener("click", function () {
      document.querySelectorAll(".tab-btn").forEach(function (b) { b.setAttribute("aria-selected", "false"); });
      btn.setAttribute("aria-selected", "true");
      state.tab = btn.getAttribute("data-tab");
      var isMap = state.tab === "map";
      document.getElementById("mapPane").hidden = !isMap;
      document.getElementById("listPane").hidden = isMap;
      if (isMap) { setTimeout(function () { map.invalidateSize(); }, 50); }
      else renderList();
    });
  });

  searchInput.addEventListener("input", function (ev) { state.search = ev.target.value; renderList(); });

  // ---- add/edit sheet ----
  var FIELDS_BY_TYPE = { spot: [], catch: [], parking: [], access: [] };
  var DYN_FIELD_HTML = {
    date: '<div class="field"><label for="f_date">Datum</label><input id="f_date" type="date" /></div>',
    method: '<div class="field"><label for="f_method">Methode</label><select id="f_method"><option value="">–</option><option>Fliege</option><option>Spinnrute</option><option>Sonstige</option></select></div>',
    lengthCm: '<div class="field"><label for="f_length">Länge (cm)</label><input id="f_length" type="number" inputmode="numeric" /></div>',
    countFish: '<div class="field"><label for="f_count">Anzahl Fische</label><input id="f_count" type="number" inputmode="numeric" value="1" /></div>',
    waterTempC: '<div class="field"><label for="f_temp">Wassertemp. (°C)</label><input id="f_temp" type="number" inputmode="numeric" /></div>',
    wind: '<div class="field"><label for="f_wind">Wind</label><input id="f_wind" type="text" placeholder="z.B. Ost, 3 Bft" /></div>',
    salinityPct: '<div class="field"><label for="f_sal">Salzgehalt (%)</label><input id="f_sal" type="text" /></div>',
    weather: '<div class="field"><label for="f_weather">Wetter</label><input id="f_weather" type="text" placeholder="sonnig, wolkig …" /></div>'
  };
  var currentType = "spot", currentLanded = true, sheetEl = null;

  function sheetTemplate() {
    return '<div class="sheet-backdrop" id="sheetBackdrop"><div class="sheet">' +
      '<h2 id="sheetTitle">Neuer Eintrag</h2>' +
      '<div class="type-picker" id="mainTypePicker">' +
        '<button type="button" class="type-opt spot" data-type="spot">Spot</button>' +
        '<button type="button" class="type-opt catch" data-type="catch">Fang</button>' +
        '<button type="button" class="type-opt parking" data-type="parking">Parken</button>' +
        '<button type="button" class="type-opt access" data-type="access">Zugang</button>' +
      "</div>" +
      '<div class="field"><label for="f_name">Name</label><input id="f_name" type="text" placeholder="z.B. Steinige Kante am Leuchtturm" /></div>' +
      '<div class="field-row">' +
        '<div class="field"><label for="f_lat">Breite (lat)</label><input id="f_lat" type="number" step="0.000001" inputmode="decimal" /></div>' +
        '<div class="field"><label for="f_lng">Länge (lng)</label><input id="f_lng" type="number" step="0.000001" inputmode="decimal" /></div>' +
      "</div>" +
      '<button type="button" class="btn-secondary" id="locateBtn" style="margin-bottom:12px">📍 Aktuellen Standort verwenden</button>' +
      '<div id="dynamicFields"></div>' +
      '<div class="field"><label for="f_notes">Notizen</label><textarea id="f_notes" placeholder="Köder, Bedingungen, Beobachtungen …"></textarea></div>' +
      '<div class="sheet-actions">' +
        '<button type="button" class="btn-secondary" id="cancelBtn">Abbrechen</button>' +
        '<button type="button" class="btn-primary" id="saveBtn">Speichern</button>' +
      "</div>" +
    "</div></div>";
  }

  var CATCH_FIELD_IDS = { date: "f_date", method: "f_method", lengthCm: "f_length", countFish: "f_count", waterTempC: "f_temp", wind: "f_wind", salinityPct: "f_sal", weather: "f_weather" };
  var SHARED_CATCH_FIELDS = ["date", "method", "waterTempC", "wind", "salinityPct", "weather"];

  function renderCatchFields() {
    var preserve = {};
    SHARED_CATCH_FIELDS.forEach(function (k) {
      var el = document.getElementById(CATCH_FIELD_IDS[k]);
      if (el) preserve[k] = el.value;
    });
    var order = ["date", "method"].concat(currentLanded ? ["lengthCm", "countFish"] : []).concat(["waterTempC", "wind", "salinityPct", "weather"]);
    var html = '<div class="field"><label>Ergebnis</label><div class="type-picker" id="landedPicker">' +
      '<button type="button" class="type-opt" data-landed="true" aria-pressed="' + (currentLanded === true) + '">Gelandet</button>' +
      '<button type="button" class="type-opt" data-landed="false" aria-pressed="' + (currentLanded === false) + '">Nur Biss</button>' +
      "</div></div>" +
      order.map(function (f) { return DYN_FIELD_HTML[f] || ""; }).join("");
    document.getElementById("dynamicFields").innerHTML = html;
    SHARED_CATCH_FIELDS.forEach(function (k) {
      var el = document.getElementById(CATCH_FIELD_IDS[k]);
      if (el && preserve[k]) el.value = preserve[k];
    });
    document.querySelectorAll("#landedPicker .type-opt").forEach(function (btn) {
      btn.addEventListener("click", function () {
        currentLanded = btn.getAttribute("data-landed") === "true";
        renderCatchFields();
      });
    });
  }

  function setType(type) {
    currentType = type;
    document.querySelectorAll("#mainTypePicker .type-opt").forEach(function (b) { b.setAttribute("aria-pressed", b.getAttribute("data-type") === type ? "true" : "false"); });
    if (type === "catch") {
      renderCatchFields();
    } else {
      var fields = FIELDS_BY_TYPE[type];
      document.getElementById("dynamicFields").innerHTML = fields.map(function (f) { return DYN_FIELD_HTML[f] || ""; }).join("");
    }
  }

  function fillDynamic(entry) {
    Object.keys(CATCH_FIELD_IDS).forEach(function (k) {
      var el = document.getElementById(CATCH_FIELD_IDS[k]);
      if (el && entry[k] != null) el.value = entry[k];
    });
  }

  function openSheet(entry, preset) {
    document.body.insertAdjacentHTML("beforeend", sheetTemplate());
    sheetEl = document.getElementById("sheetBackdrop");
    state.editingId = entry ? entry.id : null;
    currentType = entry ? entry.type : (preset && preset.type) || "spot";
    currentLanded = entry ? entry.landed !== false : true;
    document.getElementById("sheetTitle").textContent = entry ? "Eintrag bearbeiten" : "Neuer Eintrag";
    setType(currentType);
    document.querySelectorAll("#mainTypePicker .type-opt").forEach(function (btn) {
      btn.addEventListener("click", function () { currentLanded = true; setType(btn.getAttribute("data-type")); });
    });
    if (entry) {
      document.getElementById("f_name").value = entry.name || "";
      document.getElementById("f_lat").value = entry.lat;
      document.getElementById("f_lng").value = entry.lng;
      document.getElementById("f_notes").value = entry.notes || "";
      fillDynamic(entry);
    } else if (preset) {
      document.getElementById("f_lat").value = preset.lat.toFixed(6);
      document.getElementById("f_lng").value = preset.lng.toFixed(6);
    }
    document.getElementById("cancelBtn").addEventListener("click", closeSheet);
    sheetEl.addEventListener("click", function (ev) { if (ev.target === sheetEl) closeSheet(); });
    document.getElementById("saveBtn").addEventListener("click", saveEntry);
    document.getElementById("locateBtn").addEventListener("click", useLocation);
  }

  function useLocation() {
    var btn = document.getElementById("locateBtn");
    btn.textContent = "Suche Standort …";
    if (!navigator.geolocation) { btn.textContent = "Standort nicht verfügbar"; return; }
    navigator.geolocation.getCurrentPosition(function (pos) {
      document.getElementById("f_lat").value = pos.coords.latitude.toFixed(6);
      document.getElementById("f_lng").value = pos.coords.longitude.toFixed(6);
      btn.textContent = "📍 Aktuellen Standort verwenden";
    }, function () {
      btn.textContent = "Standort nicht verfügbar";
      setTimeout(function () { btn.textContent = "📍 Aktuellen Standort verwenden"; }, 2000);
    }, { timeout: 8000 });
  }

  function closeSheet() {
    if (sheetEl) sheetEl.remove();
    sheetEl = null; state.editingId = null;
    if (ghostMarker) { map.removeLayer(ghostMarker); ghostMarker = null; }
  }

  function showToast(msg) {
    var t = document.createElement("div");
    t.className = "toast"; t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(function () { t.remove(); }, 2400);
  }

  function saveEntry() {
    var lat = parseFloat(document.getElementById("f_lat").value);
    var lng = parseFloat(document.getElementById("f_lng").value);
    if (isNaN(lat) || isNaN(lng)) { showToast("Bitte Koordinaten eintragen"); return; }
    var data = {
      type: currentType,
      name: document.getElementById("f_name").value.trim() || TYPE_LABEL[currentType],
      lat: lat, lng: lng,
      notes: document.getElementById("f_notes").value.trim() || null
    };
    if (currentType === "catch") {
      var g = function (id) { var el = document.getElementById(id); return el ? el.value : ""; };
      data.landed = currentLanded;
      data.date = g("f_date") || null;
      data.method = g("f_method") || null;
      data.lengthCm = currentLanded && g("f_length") ? parseInt(g("f_length"), 10) : null;
      data.countFish = currentLanded ? (g("f_count") ? parseInt(g("f_count"), 10) : 1) : null;
      data.waterTempC = g("f_temp") ? parseInt(g("f_temp"), 10) : null;
      data.wind = g("f_wind") || null;
      data.salinityPct = g("f_sal") || null;
      data.weather = g("f_weather") || null;
    }
    var saveBtn = document.getElementById("saveBtn");
    saveBtn.disabled = true;
    saveBtn.textContent = "Speichert …";
    var promise;
    if (state.editingId) {
      data.updatedAt = new Date().toISOString();
      promise = db.collection("entries").doc(state.editingId).update(data);
    } else {
      data.createdAt = new Date().toISOString();
      data.createdBy = auth.currentUser ? (auth.currentUser.displayName || auth.currentUser.email) : null;
      promise = db.collection("entries").add(data);
    }
    promise.then(function () {
      closeSheet();
      showToast("Gespeichert");
    }).catch(function (err) {
      saveBtn.disabled = false;
      saveBtn.textContent = "Speichern";
      showToast("Fehler beim Speichern: " + (err && err.message ? err.message : "unbekannt"));
    });
  }

  function deleteEntry(entry) {
    db.collection("entries").doc(entry.id).delete().then(function () {
      showToast("Gelöscht");
    }).catch(function () {
      showToast("Konnte nicht gelöscht werden");
    });
  }

  document.getElementById("fabAdd").addEventListener("click", function () {
    var c = map.getCenter();
    openSheet(null, { lat: c.lat, lng: c.lng, type: "spot" });
  });

  // ---- auth ----
  var authMode = "signin";
  var authLoadingEl = document.getElementById("authLoading");
  var authScreenEl = document.getElementById("authScreen");
  var authSubEl = document.getElementById("authSub");
  var authErrorEl = document.getElementById("authError");
  var authNameField = document.getElementById("authNameField");
  var authNameEl = document.getElementById("auth_name");
  var authEmailEl = document.getElementById("auth_email");
  var authPassEl = document.getElementById("auth_pass");
  var authSubmitBtn = document.getElementById("authSubmitBtn");
  var appEl = document.getElementById("app");

  function showAuthError(msg) {
    authErrorEl.textContent = msg;
    authErrorEl.classList.add("show");
  }
  function clearAuthError() {
    authErrorEl.textContent = "";
    authErrorEl.classList.remove("show");
  }

  function setAuthMode(mode) {
    authMode = mode;
    clearAuthError();
    authNameField.hidden = mode !== "signup";
    if (mode === "signin") {
      authSubEl.textContent = "Mit E-Mail anmelden";
      authSubmitBtn.textContent = "Anmelden";
      document.getElementById("authModeSwitch").innerHTML = 'Noch kein Konto? <button type="button" id="authModeToggle">Registrieren</button>';
    } else {
      authSubEl.textContent = "Neues Konto erstellen (nur mit freigeschalteter E-Mail nutzbar)";
      authSubmitBtn.textContent = "Registrieren";
      document.getElementById("authModeSwitch").innerHTML = 'Schon ein Konto? <button type="button" id="authModeToggle">Anmelden</button>';
    }
    document.getElementById("authModeToggle").addEventListener("click", function () {
      setAuthMode(authMode === "signin" ? "signup" : "signin");
    });
  }
  setAuthMode("signin");

  function authErrorMessage(err) {
    var msgs = {
      "auth/invalid-email": "Ungültige E-Mail-Adresse.",
      "auth/user-not-found": "Kein Konto mit dieser E-Mail gefunden.",
      "auth/wrong-password": "Falsches Passwort.",
      "auth/email-already-in-use": "Für diese E-Mail existiert bereits ein Konto – bitte anmelden.",
      "auth/weak-password": "Passwort zu kurz (mind. 6 Zeichen).",
      "auth/invalid-credential": "E-Mail oder Passwort falsch."
    };
    return msgs[err.code] || (err.message || "Unbekannter Fehler.");
  }

  authSubmitBtn.addEventListener("click", function () {
    clearAuthError();
    var email = authEmailEl.value.trim();
    var pass = authPassEl.value;
    var name = authNameEl.value.trim();
    if (!email || !pass) { showAuthError("Bitte E-Mail und Passwort eingeben."); return; }
    if (authMode === "signup" && !name) { showAuthError("Bitte deinen Namen eingeben."); return; }
    authSubmitBtn.disabled = true;
    var original = authSubmitBtn.textContent;
    authSubmitBtn.textContent = "Bitte warten …";
    var action = authMode === "signin"
      ? auth.signInWithEmailAndPassword(email, pass)
      : auth.createUserWithEmailAndPassword(email, pass).then(function (cred) {
          return cred.user.updateProfile({ displayName: name }).then(function () {
            updateProfileBadge(cred.user);
          });
        });
    action.catch(function (err) {
      showAuthError(authErrorMessage(err));
    }).finally(function () {
      authSubmitBtn.disabled = false;
      authSubmitBtn.textContent = original;
    });
  });

  // ---- profile sheet ----
  function initialsFor(user) {
    var base = (user.displayName || user.email || "?").trim();
    return base.charAt(0).toUpperCase();
  }

  function openProfileSheet() {
    var user = auth.currentUser;
    if (!user) return;
    document.body.insertAdjacentHTML("beforeend",
      '<div class="sheet-backdrop" id="profileBackdrop"><div class="sheet">' +
        '<h2>Profil</h2>' +
        '<div class="field"><label for="p_name">Name</label><input id="p_name" type="text" value="' + escapeHtml(user.displayName || "") + '" /></div>' +
        '<div class="field"><label for="p_email">E-Mail</label><input id="p_email" type="text" value="' + escapeHtml(user.email || "") + '" disabled /></div>' +
        '<div class="sheet-actions">' +
          '<button type="button" class="btn-secondary" id="profileCloseBtn">Schließen</button>' +
          '<button type="button" class="btn-primary" id="profileSaveBtn">Speichern</button>' +
        "</div>" +
        '<button type="button" class="btn-secondary" id="profileSignOutBtn" style="width:100%;margin-top:10px;color:var(--danger);border-color:var(--danger)">Abmelden</button>' +
      "</div></div>");
    var backdrop = document.getElementById("profileBackdrop");
    function close() { backdrop.remove(); }
    backdrop.addEventListener("click", function (ev) { if (ev.target === backdrop) close(); });
    document.getElementById("profileCloseBtn").addEventListener("click", close);
    document.getElementById("profileSignOutBtn").addEventListener("click", function () { close(); auth.signOut(); });
    document.getElementById("profileSaveBtn").addEventListener("click", function () {
      var newName = document.getElementById("p_name").value.trim();
      if (!newName) { showToast("Bitte einen Namen eingeben"); return; }
      var btn = document.getElementById("profileSaveBtn");
      btn.disabled = true;
      btn.textContent = "Speichert …";
      user.updateProfile({ displayName: newName }).then(function () {
        updateProfileBadge(user);
        showToast("Gespeichert");
        close();
      }).catch(function () {
        btn.disabled = false;
        btn.textContent = "Speichern";
        showToast("Fehler beim Speichern");
      });
    });
  }
  document.getElementById("profileBtn").addEventListener("click", openProfileSheet);

  function updateProfileBadge(user) {
    document.getElementById("viewerNote").textContent = user.displayName || user.email;
    document.getElementById("profileBtn").textContent = initialsFor(user);
  }

  auth.onAuthStateChanged(function (user) {
    authLoadingEl.hidden = true;
    if (user) {
      authScreenEl.hidden = true;
      appEl.hidden = false;
      updateProfileBadge(user);
      subscribeEntries();
    } else {
      appEl.hidden = true;
      unsubscribeAndReset();
      authScreenEl.hidden = false;
    }
  });
})();
</script>
</body>
</html>
